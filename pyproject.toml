[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brewscope"
version = "0.2.0"
description = "ABSA untuk prioritisasi strategis coffee shop di Jatinangor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apify-client>=3.3,<4",
    "jsonschema>=4.23,<5",
    "pandas>=2.2,<3",
    "python-dotenv>=1.1,<2",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 88
target-version = "py311"
